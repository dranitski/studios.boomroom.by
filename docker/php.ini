; Mirrors the release pool (boom-ubuntu: /home/boom-studios/compose/php/php.ini), warnings shown for local dev
; (notices hidden: the code relies on undefined vars/props everywhere)
memory_limit = 1024M
max_execution_time = 400
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_STRICT
display_errors = On
short_open_tag = On
date.timezone = Europe/Minsk
default_charset = ""
; config.php connects to "localhost", i.e. the MySQL socket shared from the db container
mysql.default_socket = /var/run/mysqld/mysqld.sock
mysqli.default_socket = /var/run/mysqld/mysqld.sock
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock
