; Mirrors the release pool (boom-ubuntu: /home/boom-studios/compose/php/php.ini); errors are shown for local dev
memory_limit = 1024M
max_execution_time = 400
error_reporting = E_ALL
display_errors = On
log_errors = On
short_open_tag = On
date.timezone = Europe/Minsk
default_charset = ""
; config.php connects to "localhost", i.e. the MySQL socket shared from the db container
mysqli.default_socket = /var/run/mysqld/mysqld.sock
