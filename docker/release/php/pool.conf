[global]
error_log = /proc/self/fd/2
log_level = warning
[www]
; container root is the boom-studios user on the host, so files PHP writes stay owned by boom-studios
user = root
group = root
listen = 9000
access.log = /dev/null
; PHP errors go to Apache over FastCGI: ~/logs/apache/studios.boomroom.by.error.log (as admin.boomschool.by -> its nginx log)
catch_workers_output = no
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 300
