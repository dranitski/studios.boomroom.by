; studios.boomroom.by release settings (ported from the PHP 5.6 pool's php.ini)
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 60
max_input_vars = 1000
; Legacy code reads undefined variables/keys everywhere (notices on 5.6, warnings on 8.x): only errors are logged
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING
display_errors = Off
log_errors = On
; errors go to Apache over FastCGI (the official image turns this off in docker-fpm.ini)
fastcgi.logging = On
html_errors = Off
output_buffering = 4096
short_open_tag = On
date.timezone = Europe/Minsk
default_charset = ""
allow_url_fopen = On
expose_php = Off
default_socket_timeout = 10
sendmail_path = /usr/bin/msmtp -t -i
session.save_path = /var/www/www-root/data/bin-tmp/
upload_tmp_dir = /var/www/www-root/data/bin-tmp/
session.upload_progress.enabled = Off
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440
mysqli.default_socket = /var/run/mysqld/mysqld.sock
opcache.enable = 1
opcache.memory_consumption = 48
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
